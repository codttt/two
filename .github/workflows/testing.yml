name: Тестирование и качество

on:
  push:
    branches: [main, lr4-testing]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
      - name: Установка Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Установка средств проверки
        run: python -m pip install -r requirements-dev.txt
      - name: Инспекция кода
        run: flake8 src tests tools
      - name: Тесты и покрытие
        run: |
          coverage run -m unittest discover -v
          coverage report --fail-under=90
      - name: Регрессионные тесты
        run: python -m unittest tests.test_quality.RegressionTests -v
